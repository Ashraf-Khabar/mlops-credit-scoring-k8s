apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-credit
spec:
  selector:
    matchLabels:
      app: api-credit
  template:
    metadata:
      labels:
        app: api-credit
    spec:
      containers:
      - name: api
        image: ml-api:1.0.1
        imagePullPolicy: Never
        ports:
        - containerPort: 8000
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"