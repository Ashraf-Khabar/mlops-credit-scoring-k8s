apiVersion: apps/v1
kind: Deployment
metadata:
  name: front-credit
spec:
  replicas: 1                  
  selector:
    matchLabels:
      app: front-credit
  template:
    metadata:
      labels:
        app: front-credit
    spec:
      containers:
      - name: front
        resources:
          requests:
            cpu: 25m
            memory: 32Mi
          limits:
            cpu: 100m
            memory: 64Mi