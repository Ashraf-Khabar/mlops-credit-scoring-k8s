apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-credit
spec:
  template:
    spec:
      containers:
      - name: api
        env:
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: POSTGRES_USER
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: POSTGRES_PASSWORD
        - name: POSTGRES_DB
          valueFrom:
            secretKeyRef:
              name: postgres-secret 
              key: POSTGRES_DB
        - name: POSTGRES_HOST
          value: "db-service"