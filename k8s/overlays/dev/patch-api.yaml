apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-credit
spec:
  replicas: 3
  template:
    spec:
      containers:
      - name: api
        image: ml-api:1.1.5
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 250m
            memory: 256Mi
        env:

        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: db-secret
              key: POSTGRES_USER
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: db-secret
              key: POSTGRES_PASSWORD
        - name: POSTGRES_HOST
          value: "db-service"
        - name: POSTGRES_DB
          value: "credit_db"