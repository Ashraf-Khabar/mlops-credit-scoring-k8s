version: '3.8'

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adminpassword
      POSTGRES_DB: credit_db
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d credit_db"]
      interval: 3s
      timeout: 3s
      retries: 5

  api:
    build: 
      context: ./app/backend
      dockerfile: dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+psycopg2://admin:adminpassword@db:5432/credit_db
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./app/backend:/app

  frontend:
    build:
      context: ./app/frontend
    ports:
      - "3000:3000"
    volumes:
      - ./app/frontend:/app
      - /app/node_modules
    depends_on:
      - api