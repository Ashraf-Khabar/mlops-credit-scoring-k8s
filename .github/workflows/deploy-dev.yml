name: Build & Deploy to Dev

on:
  push:
    branches:
      - main
    paths:
      - 'app/**'

jobs:

  test:
    runs-on: ubuntu-latest
    steps:
        - name : Setup the env of test
          run: echo "The script is managed"
        
  build-and-deploy:
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - name: Checkout the code
        uses: actions/checkout@v3

      - name: Connexion on Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extraire the hash on commit
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Build and Push (API)
        uses: docker/build-push-action@v4
        with:
          context: ./app/api
          push: true
          tags: akaax/ml-api:${{ steps.vars.outputs.sha_short }}

      - name: Update dev.yml
        run: |
          # Chnage the image by the new one
          sed -i "s|image: .*ml-api:.*|image: akaax/ml-api:${{ steps.vars.outputs.sha_short }}|g" kubernetes/dev/dev.yml
          
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add kubernetes/dev/dev.yml
          git commit -m "Auto-update: API to ${{ steps.vars.outputs.sha_short }} in DEV"
          git push