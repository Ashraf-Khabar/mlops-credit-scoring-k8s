<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SaaS - Credit Scoring</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-gray-100 font-sans leading-normal tracking-normal flex">

    <!-- Sidebar -->
    <div class="bg-gray-900 shadow-xl h-screen w-64 fixed left-0 top-0 text-white transition-all hidden md:block" id="sidebar">
        <div class="p-6 text-2xl font-bold border-b border-gray-800 text-blue-400">CreditPro AI</div>
        <ul class="p-4 space-y-4">
            <li><a href="#" onclick="showSection('dashboard')" class="block py-2 px-4 rounded hover:bg-gray-800 hover:text-blue-300">📊 Tableau de bord</a></li>
            <li><a href="#" onclick="showSection('new-scoring')" class="block py-2 px-4 rounded hover:bg-gray-800 hover:text-blue-300">➕ Nouvelle Demande</a></li>
            <li><a href="#" onclick="logout()" class="block py-2 px-4 rounded text-red-400 hover:bg-gray-800 mt-10">🚪 Déconnexion</a></li>
        </ul>
    </div>

    <!-- Main Content -->
    <div class="ml-0 md:ml-64 w-full p-8 transition-all" id="main-content">
        
        <!-- Section Auth (Login/Register) -->
        <div id="auth-section" class="max-w-md mx-auto bg-white rounded-xl shadow-lg p-8 mt-20">
            <h2 class="text-2xl font-bold text-center mb-6">Connexion</h2>
            <form id="loginForm" class="space-y-4">
                <input type="text" id="username" placeholder="Nom d'utilisateur" class="w-full p-3 border rounded" required>
                <input type="password" id="password" placeholder="Mot de passe" class="w-full p-3 border rounded" required>
                <button type="submit" class="w-full bg-blue-600 text-white p-3 rounded font-bold hover:bg-blue-700">Se connecter</button>
                <p class="text-center text-sm text-gray-500 mt-4 cursor-pointer hover:underline" onclick="toggleAuthMode()">Créer un compte</p>
            </form>
        </div>

        <!-- Section Dashboard -->
        <div id="dashboard-section" class="hidden">
            <h1 class="text-3xl font-bold text-gray-800 mb-8">Vue d'ensemble</h1>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
                <div class="bg-white p-6 rounded-xl shadow border-l-4 border-blue-500">
                    <h3 class="text-gray-500 font-bold">Dossiers Analysés</h3>
                    <p class="text-3xl font-bold text-gray-800" id="stat-total">0</p>
                </div>
                <div class="bg-white p-6 rounded-xl shadow border-l-4 border-green-500">
                    <h3 class="text-gray-500 font-bold">Taux d'approbation</h3>
                    <p class="text-3xl font-bold text-gray-800" id="stat-rate">0%</p>
                </div>
            </div>
            <div class="bg-white p-6 rounded-xl shadow w-full max-w-2xl">
                <canvas id="historyChart"></canvas>
            </div>
        </div>

        <!-- Section Nouvelle Demande -->
        <div id="new-scoring-section" class="hidden max-w-2xl bg-white rounded-xl shadow-lg p-8">
            <h2 class="text-2xl font-bold text-gray-800 mb-6">Analyser un profil</h2>
            <form id="scoringForm" class="grid grid-cols-2 gap-6">
                <div><label class="block text-sm font-bold">Âge</label><input type="number" id="age" class="w-full p-2 border rounded mt-1" required></div>
                <div><label class="block text-sm font-bold">Revenu (€)</label><input type="number" id="income" class="w-full p-2 border rounded mt-1" required></div>
                <div><label class="block text-sm font-bold">Montant Prêt (€)</label><input type="number" id="loan_amount" class="w-full p-2 border rounded mt-1" required></div>
                <div><label class="block text-sm font-bold">Historique (ans)</label><input type="number" id="credit_history" class="w-full p-2 border rounded mt-1" required></div>
                <button type="submit" class="col-span-2 bg-indigo-600 text-white p-3 rounded font-bold hover:bg-indigo-700">Générer le Score</button>
            </form>
            <div id="result" class="mt-6 p-4 rounded hidden"></div>
        </div>

    </div>

    <script>
        let token = localStorage.getItem('token');
        let isLogin = true;
        let chartInstance = null;

        // Routage Basique UI
        function checkAuth() {
            if(token) {
                document.getElementById('auth-section').classList.add('hidden');
                document.getElementById('sidebar').classList.remove('hidden');
                showSection('dashboard');
                initChart();
            } else {
                document.getElementById('auth-section').classList.remove('hidden');
                document.getElementById('sidebar').classList.add('hidden');
                document.getElementById('dashboard-section').classList.add('hidden');
                document.getElementById('new-scoring-section').classList.add('hidden');
            }
        }

        function showSection(id) {
            document.getElementById('dashboard-section').classList.add('hidden');
            document.getElementById('new-scoring-section').classList.add('hidden');
            document.getElementById(`${id}-section`).classList.remove('hidden');
        }

        function logout() {
            localStorage.removeItem('token');
            token = null;
            checkAuth();
        }

        function toggleAuthMode() {
            isLogin = !isLogin;
            document.querySelector('#auth-section h2').innerText = isLogin ? "Connexion" : "Inscription";
            document.querySelector('#auth-section button').innerText = isLogin ? "Se connecter" : "S'inscrire";
        }

        // Authentification API
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new URLSearchParams();
            formData.append('username', document.getElementById('username').value);
            formData.append('password', document.getElementById('password').value);
            
            const endpoint = isLogin ? '/api/token' : '/api/register';
            const res = await fetch(endpoint, { method: 'POST', body: formData });
            
            if(res.ok) {
                if(isLogin) {
                    const data = await res.json();
                    token = data.access_token;
                    localStorage.setItem('token', token);
                    checkAuth();
                } else {
                    alert("Compte créé ! Connectez-vous.");
                    toggleAuthMode();
                }
            } else alert("Erreur d'identifiants");
        });

        // Scoring API
        document.getElementById('scoringForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const data = {
                age: parseInt(document.getElementById('age').value),
                income: parseFloat(document.getElementById('income').value),
                loan_amount: parseFloat(document.getElementById('loan_amount').value),
                credit_history_length: parseInt(document.getElementById('credit_history').value)
            };

            const res = await fetch('/api/predict', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                body: JSON.stringify(data)
            });

            const resultDiv = document.getElementById('result');
            resultDiv.classList.remove('hidden');
            if(res.ok) {
                const result = await res.json();
                resultDiv.className = `mt-6 p-4 rounded font-bold text-white ${result.status === 'Approuvé' ? 'bg-green-500' : 'bg-red-500'}`;
                resultDiv.innerText = `${result.status} - Confiance: ${(result.probability*100).toFixed(1)}%`;
            } else if(res.status === 401) { logout(); }
        });

        // Graphique Démo Chart.js
        function initChart() {
            const ctx = document.getElementById('historyChart').getContext('2d');
            if(chartInstance) chartInstance.destroy();
            chartInstance = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: ['Approuvés', 'Refusés'],
                    datasets: [{ data: [75, 25], backgroundColor: ['#10B981', '#EF4444'] }]
                }
            });
            document.getElementById('stat-total').innerText = "124";
            document.getElementById('stat-rate').innerText = "75%";
        }

        checkAuth();
    </script>
</body>
</html>
